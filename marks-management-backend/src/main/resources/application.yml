server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/marks_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update # Automatically create/update schema for development
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false # Disabled for easy initial development, can be enabled with SQL scripts later

app:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d3b7a1e5f8c3d2e1a4b6c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c} # Base64 encoded or long random string
    expiration-ms: 1800000 # 30 minutes
    refresh-expiration-ms: 604800000 # 7 days
